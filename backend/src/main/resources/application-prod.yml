spring:
  data:
    mongodb:
      uri: ${MONGO_URI}

app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-milliseconds: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.trillion.trader: INFO

server:
  error:
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
